<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-memes · 表情包画廊</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --fg:#1b1d21; --card:#fff; --line:#e3e6ea; --dim:#6b7280; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15171a; --fg:#e8eaed; --card:#1e2126; --line:#2c3036; --dim:#9aa2ad; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { max-width:1100px; margin:0 auto 14px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:13px; }
  .controls { position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 0; display:flex; flex-wrap:wrap; gap:8px; }
  input[type=search] { flex:1 1 220px; min-width:0; padding:9px 12px; border:1px solid var(--line);
        border-radius:10px; background:var(--card); color:var(--fg); font-size:15px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:999px;
          padding:6px 11px; font-size:13px; cursor:pointer; white-space:nowrap; }
  .chip[aria-pressed=true] { background:#3b82f6; border-color:#3b82f6; color:#fff; }
  main { max-width:1100px; margin:0 auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
  figure { margin:0; background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  figure img { width:100%; aspect-ratio:1/1; object-fit:contain; display:block; background:#fafafa; cursor:zoom-in; }
  @media (prefers-color-scheme: dark) { figure img { background:#0f1114; } }
  figcaption { padding:8px 10px; font-size:12px; color:var(--dim); }
  figcaption b { display:block; color:var(--fg); font-weight:600; font-size:12.5px; margin-bottom:2px; }
  .empty { text-align:center; color:var(--dim); padding:48px 0; }
  #viewer { position:fixed; inset:0; background:rgba(0,0,0,.82); display:none; align-items:center;
            justify-content:center; padding:20px; z-index:50; cursor:zoom-out; }
  #viewer img { max-width:100%; max-height:100%; object-fit:contain; }
  footer { max-width:1100px; margin:24px auto 8px; color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>dsh-memes</h1>
  <div class="sub" id="count">加载中…</div>
  <div class="controls">
    <input id="q" type="search" placeholder="搜描述 / 关键词，比如 生气、摸鱼、比心">
    <div class="chips" id="packs"></div>
    <div class="chips" id="tags"></div>
  </div>
</header>
<main><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>没有匹配的表情</div></main>
<footer>数据来自 <code>catalog.json</code>；图片按情绪分类存放于 <code>packs/&lt;库ID&gt;/memes/</code>。各库授权不同，商用前先看库内声明。</footer>
<div id="viewer"><img alt=""></div>
<script>
const state = { data: [], pack: null, tag: null, q: "" };
const $ = (s) => document.querySelector(s);

fetch("catalog.json").then(r => r.json()).then(cat => {
  state.data = cat.packs.flatMap(p => p.entries.map(e => ({
    ...e, pack: p.id, packName: p.name
  })));
  renderChips(cat.packs);
  render();
}).catch(err => { $("#count").textContent = "加载 catalog.json 失败：" + err.message; });

const chipRefs = [];
function renderChips(packs) {
  packs.forEach(pk => {
    const b = chip(`${pk.name} ${pk.count}`, () => {
      state.pack = state.pack === pk.id ? null : pk.id; render();
    });
    chipRefs.push({ b, on: () => state.pack === pk.id });
    $("#packs").appendChild(b);
  });
  [...new Set(state.data.map(e => e.tag))].sort().forEach(tg => {
    const b = chip(tg, () => { state.tag = state.tag === tg ? null : tg; render(); });
    chipRefs.push({ b, on: () => state.tag === tg });
    $("#tags").appendChild(b);
  });
}

function chip(label, onClick) {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.textContent = label;
  b.onclick = onClick;
  return b;
}

function matches(e) {
  if (state.pack && e.pack !== state.pack) return false;
  if (state.tag && e.tag !== state.tag) return false;
  if (!state.q) return true;
  const hay = (e.caption + " " + e.keywords + " " + e.tag + " " + e.file + " " + e.packName).toLowerCase();
  return state.q.split(/\s+/).filter(Boolean).every(w => hay.includes(w.toLowerCase()));
}

function render() {
  chipRefs.forEach(({ b, on }) => b.setAttribute("aria-pressed", String(on())));
  const list = state.data.filter(matches);
  $("#count").textContent = `${list.length} / ${state.data.length} 张` +
    (state.pack ? ` · ${state.pack}` : "") + (state.tag ? ` · ${state.tag}` : "");
  const grid = $("#grid");
  grid.innerHTML = "";
  const frag = document.createDocumentFragment();
  list.forEach(e => {
    const fig = document.createElement("figure");
    const img = document.createElement("img");
    img.loading = "lazy";
    img.src = `packs/${e.pack}/${e.file}`;
    img.alt = e.caption || e.file;
    img.onclick = () => { const v = $("#viewer"); v.style.display = "flex"; v.querySelector("img").src = img.src; };
    const cap = document.createElement("figcaption");
    cap.innerHTML = `<b>${esc(e.caption || e.file)}</b>${e.tag} · ${esc(e.keywords || "")}`;
    fig.append(img, cap);
    frag.appendChild(fig);
  });
  grid.appendChild(frag);
  $("#empty").hidden = list.length > 0;
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

$("#q").addEventListener("input", e => { state.q = e.target.value.trim(); render(); });
$("#viewer").addEventListener("click", () => { $("#viewer").style.display = "none"; });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#viewer").style.display = "none"; });
</script>
</body>
</html>
